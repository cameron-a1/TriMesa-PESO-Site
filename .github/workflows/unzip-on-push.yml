name: Unzip project.zip to repo root

on:
  workflow_dispatch: {}          # allow manual run
  push:
    paths:
      - "project.zip"            # also run when project.zip is added/changed

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify ZIP exists
        run: |
          if [ ! -f project.zip ]; then
            echo "project.zip not found in repo root"; exit 1
          fi

      - name: Install unzip + rsync
        run: sudo apt-get update && sudo apt-get install -y unzip rsync

      - name: Extract zip to temp
        run: |
          rm -rf _extract
          mkdir _extract
          unzip -q project.zip -d _extract

      - name: Move extracted files to root (handles inner folder)
        run: |
          shopt -s dotglob
          inner_dir=$(find _extract -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
          if [ -n "$inner_dir" ] && [ "$(ls -A "$inner_dir")" ]; then
            rsync -a "$inner_dir"/ .
          else
            rsync -a _extract/ .
          fi

      - name: Cleanup temp + zip
        run: |
          rm -rf _extract
          rm -f project.zip

      - name: Commit & push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract project.zip to repo root [auto]" || echo "Nothing to commit"
          git push
