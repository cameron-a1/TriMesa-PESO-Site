name: Unzip Project to Root

on:
  workflow_dispatch: {}   # run manually from Actions tab

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find ZIP
        id: findzip
        run: |
          zips=( *.zip */*.zip )
          if [ ${#zips[@]} -eq 0 ]; then
            echo "No zip found"; exit 1
          fi
          echo "zipfile=${zips[0]}" >> $GITHUB_OUTPUT

      - name: Unzip into temp
        run: |
          mkdir -p _tmp_extract
          unzip -q "${{ steps.findzip.outputs.zipfile }}" -d _tmp_extract

      - name: Move contents to repo root
        run: |
          inner_dir=$(find _tmp_extract -mindepth 1 -maxdepth 1 -type d | head -n 1 || true)
          if [ -n "$inner_dir" ] && [ "$(ls -A "$inner_dir")" ]; then
            shopt -s dotglob
            mv "$inner_dir"/* .
          else
            shopt -s dotglob
            mv _tmp_extract/* .
          fi

      - name: Clean up zip & temp
        run: |
          rm -rf _tmp_extract
          rm -f "${{ steps.findzip.outputs.zipfile }}"

      - name: Commit & push extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip project to repo root [auto]"
          git push
